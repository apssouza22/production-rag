[project]
name = "custom-evals"
version = "0.1.0"
description = "Evaluation frameworks for the RAG API (Langfuse traces and Ragas retrieval metrics)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "colorama>=0.4.6",
    "httpx>=0.28.1",
    "langchain-community>=0.3,<0.4",
    "langfuse>=3.0.0",
    "openai>=1.0.0",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.8.1",
    "ragas>=0.4.3",
    "tqdm>=4.66.0",
]
readme = "README.md"

[project.scripts]
custom-eval = "custom_evals.main:main"
rag-eval = "rag_evals.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_evals", "rag_evals"]

[tool.hatch.build.targets.wheel.force-include]
"rag_evals/data" = "rag_evals/data"

[tool.ruff]
line-length = 130
src = ["custom_evals", "rag_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
